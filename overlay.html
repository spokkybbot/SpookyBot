<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SpookyEvents — LIVE</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:radial-gradient(1200px 800px at 20% -10%, #16233f 0%, #0b0e17 60%);color:#e8ecf5;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;padding:12px 18px 16px;display:flex;flex-direction:column;gap:12px;overflow:hidden}
header{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-bottom:10px;border-bottom:1px solid rgba(255,255,255,.07)}
.logo{font-size:18px;font-weight:800;letter-spacing:.4px}
.logo .live{font-size:10px;font-weight:700;color:#34d399;background:rgba(52,211,153,.12);border:1px solid rgba(52,211,153,.4);padding:2px 8px;border-radius:999px;margin-left:8px;vertical-align:2px;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.55}}
.h-right{display:flex;align-items:center;gap:10px}
.clock{font-family:ui-monospace,'Cascadia Code',Consolas,monospace;font-size:16px;font-weight:700;font-variant-numeric:tabular-nums;color:#9db8ff}
.updated{font-size:11px;color:#7b89a6}
main{flex:1;display:flex;flex-direction:column;gap:12px;min-height:0}
.sec{display:flex;flex-direction:column;gap:8px;min-height:0}
.sec-head{display:flex;align-items:center;gap:10px}
.sec-head h2{font-size:15px;font-weight:700}
.sec-head .count{font-size:11px;color:#7b89a6;font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:8px;overflow:hidden}
.card{background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.09);border-radius:10px;padding:8px 10px}
.ev-top{display:flex;align-items:center;gap:8px;min-width:0}
.ev-emoji{font-size:15px;flex:none}
.ev-name{font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
.ev-meta{display:flex;align-items:center;gap:8px;margin-top:5px;font-size:11.5px;color:#aab6cd}
.rar{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.3px;flex:none}
.muted{color:#8190ac}
.mine-line{display:flex;align-items:center;gap:8px;min-width:0}
.mine-line .muted{flex:none}
.mine-name{font-size:12.5px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
.cd{font-family:ui-monospace,'Cascadia Code',Consolas,monospace;font-variant-numeric:tabular-nums;font-size:14px;font-weight:700;color:#ffd28a;flex:none}
.cd.big{font-size:15px;color:#7ee0a3}
.cd.zero{color:#f87171}
.chip{font-size:10px;font-weight:700;padding:1px 7px;border-radius:999px;border:1px solid rgba(255,255,255,.14);color:#c3cede;background:rgba(255,255,255,.04);flex:none}
.up .ev-top{opacity:.75}
.empty{color:#56627c;font-size:12.5px;padding:6px 2px}
</style>
</head>
<body>
<header>
  <div class="logo">👻 SpookyEvents 1.16.5 <span class="live">LIVE</span></div>
  <div class="h-right">
    <div class="clock" id="clock">--:--:--</div>
    <div class="updated" id="updated">загрузка...</div>
  </div>
</header>
<main>
  <section class="sec">
    <div class="sec-head"><h2>🎯 Активные ивенты</h2><span class="count" id="cActive"></span></div>
    <div class="grid" id="gActive"></div>
  </section>
  <section class="sec">
    <div class="sec-head"><h2>👑 Шахты · Легендарная / Мифическая</h2><span class="count" id="cMines"></span></div>
    <div class="grid" id="gMines"></div>
  </section>
  <section class="sec">
    <div class="sec-head"><h2>⏳ Ближайшие ивенты (5)</h2><span class="count" id="cUp"></span></div>
    <div class="grid" id="gUp"></div>
  </section>
</main>
<script>
const V = '1.16.5';
let offset = 0;
const nowS = () => Date.now() / 1000 + offset;
const p2 = n => String(n).padStart(2, '0');

function fmtClock(x) {
  x = Math.max(0, Math.round(x));
  const h = Math.floor(x / 3600), m = Math.floor((x % 3600) / 60), s = x % 60;
  return h > 0 ? `${h}:${p2(m)}:${p2(s)}` : `${p2(m)}:${p2(s)}`;
}
function timeStr() {
  const d = new Date(Date.now() + offset * 1000);
  return `${p2(d.getHours())}:${p2(d.getMinutes())}:${p2(d.getSeconds())}`;
}
function typeColor(num) {
  const pre = num >= 1000 ? Math.floor(num / 1000) : Math.floor(num / 100);
  const colors = {1:'#38bdf8',2:'#f472b6',3:'#a78bfa',4:'#fbbf24',5:'#34d399',6:'#f87171'};
  return colors[pre] || '#64748b';
}
function rarityColor(name) {
  const n = (name || '').toLowerCase();
  if (n.includes('мифи')) return '#f472b6';
  if (n.includes('легенд')) return '#ffb84d';
  if (n.includes('элит')) return '#c084fc';
  if (n.includes('богат')) return '#4ade80';
  if (n.includes('солид')) return '#60a5fa';
  if (n.includes('обычн')) return '#94a3b8';
  return '#e5e7eb';
}
function parseFirst(line) {
  const m = /^\[([^\]]+)\]\s*(.+)$/.exec(line || '');
  return m ? {emoji: m[1].trim(), name: m[2].trim()} : {emoji: '🎯', name: (line || '?').trim()};
}
function el(tag, cls, text) {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text != null) n.textContent = text;
  return n;
}
function chip(text, color) {
  const c = el('span', 'chip', text);
  if (color) { c.style.borderColor = color; c.style.color = color; }
  return c;
}
function cdNode(until, fallback) {
  const c = el('span', 'cd');
  if (until != null && isFinite(until)) {
    c.setAttribute('data-until', until.toFixed(3));
    c.textContent = fmtClock(until - nowS());
  } else {
    c.textContent = fallback || '—';
  }
  return c;
}
function evEnd(e) {
  if (e.upcoming) return e.next_in_sec != null ? e.fetched_at + e.next_in_sec : null;
  return e.timer_sec != null ? e.fetched_at + e.timer_sec : null;
}
function evCard(e) {
  const {emoji, name} = parseFirst(e.raw_first_line);
  const card = el('div', 'card' + (e.upcoming ? ' up' : ''));
  const top = el('div', 'ev-top');
  top.appendChild(el('span', 'ev-emoji', emoji));
  top.appendChild(el('span', 'ev-name', name));
  top.appendChild(chip(String(e.anarchy_num), typeColor(e.anarchy_num)));
  card.appendChild(top);
  const meta = el('div', 'ev-meta');
  if (!e.upcoming) {
    if (e.rarity) {
      const b = el('span', 'rar', e.rarity);
      b.style.color = rarityColor(e.rarity);
      meta.appendChild(b);
    }
    if (e.loot_level) meta.appendChild(el('span', 'muted', e.loot_level));
    meta.appendChild(el('span', 'muted', '·'));
    meta.appendChild(cdNode(evEnd(e), e.time_str));
  } else {
    meta.appendChild(el('span', 'muted', 'через'));
    meta.appendChild(cdNode(evEnd(e), e.next_in));
  }
  card.appendChild(meta);
  return card;
}
function mineCard(m) {
  const card = el('div', 'card');
  const top = el('div', 'mine-line');
  top.appendChild(el('span', 'ev-emoji', m.emoji || '🪙'));
  top.appendChild(el('span', 'mine-name', 'Анархия ' + m.anarchy_num));
  top.appendChild(chip(String(m.anarchy_num), typeColor(m.anarchy_num)));
  card.appendChild(top);
  const meta = el('div', 'ev-meta');
  meta.appendChild(el('span', 'muted', 'Следующая:'));
  const b = el('span', 'rar', m.next_rarity || '?');
  b.style.color = rarityColor(m.next_rarity);
  meta.appendChild(b);
  meta.appendChild(el('span', 'muted', '·'));
  meta.appendChild(cdNode(m.refresh_sec != null ? m.fetched_at + m.refresh_sec : null, m.refresh_str));
  card.appendChild(meta);
  return card;
}
function fill(grid, items, cardFn, emptyText) {
  grid.textContent = '';
  if (!items.length) grid.appendChild(el('div', 'empty', emptyText));
  items.forEach(i => grid.appendChild(cardFn(i)));
}
function minePriority(m) {
  const n = (m.next_rarity || '').toLowerCase();
  if (n.includes('легенд')) return 0;
  if (n.includes('мифи')) return 1;
  return 2;
}
function render(d) {
  const evs = (d.events && d.events[V]) || [];
  const act = evs.filter(e => !e.upcoming).sort((a, b) => a.anarchy_num - b.anarchy_num);
  const up = evs.filter(e => e.upcoming)
    .sort((a, b) => (a.next_in_sec != null ? a.next_in_sec : 1e9) - (b.next_in_sec != null ? b.next_in_sec : 1e9))
    .slice(0, 5);
  const mines = (d.mines && d.mines[V]) || [];
  const topMines = mines
    .filter(m => minePriority(m) < 2)
    .sort((a, b) => minePriority(a) - minePriority(b) || a.anarchy_num - b.anarchy_num);

  fill(document.getElementById('gActive'), act, evCard, 'Нет активных ивентов');
  fill(document.getElementById('gMines'), topMines, mineCard, 'Нет легендарных / мифических шахт');
  fill(document.getElementById('gUp'), up, evCard, 'Нет ближайших ивентов');
  document.getElementById('cActive').textContent = act.length ? `( ${act.length} )` : '';
  document.getElementById('cMines').textContent = topMines.length ? `( ${topMines.length} )` : '';
  document.getElementById('cUp').textContent = up.length ? `( ${up.length} )` : '';
}
async function pull() {
  try {
    const r = await fetch('/overlay.json', {cache: 'no-store'});
    const d = await r.json();
    offset = d.now - Date.now() / 1000;
    render(d);
    const up = d.updated ? new Date(d.updated * 1000) : new Date();
    document.getElementById('updated').textContent = 'данные: ' + p2(up.getHours()) + ':' + p2(up.getMinutes()) + ':' + p2(up.getSeconds());
  } catch (e) {
    document.getElementById('updated').textContent = 'сеть недоступна — повтор...';
  }
}
setInterval(() => {
  document.getElementById('clock').textContent = timeStr();
  document.querySelectorAll('.cd').forEach(c => {
    const until = parseFloat(c.getAttribute('data-until'));
    if (!isFinite(until)) return;
    const rem = until - nowS();
    c.textContent = fmtClock(rem);
    if (rem <= 0) c.classList.add('zero');
  });
}, 1000);
pull();
setInterval(pull, 5000);
</script>
</body>
</html>
